name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    name: Server tests and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.19"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check TypeScript error baseline
        run: bun run typecheck:check
      - name: Run server tests
        # A fresh runner may need to download the temporary MongoDB binary.
        run: bun run test:run --hookTimeout=120000
      - name: Report dependency vulnerabilities
        if: always()
        continue-on-error: true
        run: bun audit

  client:
    name: Client lint, build, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.7.1
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.19"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type-check and build
        run: pnpm build
      - name: Run client tests
        run: pnpm test
      - name: Report production dependency vulnerabilities
        if: always()
        continue-on-error: true
        run: pnpm audit --prod
